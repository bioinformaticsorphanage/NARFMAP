name: dragen-os build
# using make and C/C++

on:
  release:
    types: [published]
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libgtest-dev zlib1g-dev
      - name: make (compile and launch unit tests)
        run: make -j 2
        env:
          HAS_GTEST: 0
          STATIC: 1
      - name: Test gzip reference reading
        run: python3 tests/test_gzip_reference.py
      - name: make install
        run: sudo make install
      - uses: actions/upload-artifact@v4
        with:
          name: compare
          path: ./build/release/compare
      - uses: actions/upload-artifact@v4
        with:
          name: dragen-os
          path: ./build/release/dragen-os
