[package]
name = "narfmap"
version = "1.4.2"
edition = "2021"
description = "DRAGEN-OS mapper/aligner - Rust rewrite"
license = "GPL-3.0"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }

# Bioinformatics
bio = "2.0"
noodles = { version = "0.88", features = ["fastq", "fasta", "sam", "bgzf", "core"] }

# Async for noodles
tokio = { version = "1", features = ["rt", "fs", "io-util"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Parallelism
rayon = "1.10"

# Serialization (for hash table config)
byteorder = "1.5"

# Logging
log = "0.4"
env_logger = "0.11"

# Progress bars
indicatif = "0.17"

# Compression
flate2 = "1.0"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tempfile = "3.10"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
# Enable useful warnings (warn level - don't break CI)
uninlined_format_args = "warn"
unreadable_literal = "warn"
wildcard_imports = "warn"
unused_self = "warn"
format_push_string = "warn"
redundant_clone = "warn"
manual_assert = "warn"

# Allow pedantic items that add noise without much value
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_const_for_fn = "allow"
doc_markdown = "allow"
similar_names = "allow"         # argc/argv is fine
module_name_repetitions = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
struct_excessive_bools = "allow"
cast_possible_truncation = "allow"  # Common in low-level code
cast_sign_loss = "allow"            # Common in low-level code
cast_possible_wrap = "allow"        # Common in low-level code
