[package]
name = "narfmap"
version = "1.4.2"
edition = "2021"
authors = ["Original authors <authors@example.com>"]
description = "NARFMAP - A Rust implementation of the Dragen mapper/aligner"
readme = "README.md"
license = "GPL-3.0"

[dependencies]
# Command line interface
clap = { version = "4.4.11", features = ["derive"] }
colored = "2.0"         # Colored terminal output
indicatif = "0.17"      # Progress bars and spinners
atty = "0.2"            # Terminal detection
num_cpus = "1.16"       # CPU count detection

# Logging and error handling
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
anyhow = "1.0"

# Bioinformatics
seq_io = "0.3.3"        # Fast FASTA/FASTQ parsing
bitnuc = "0.2.10"       # Efficient 2-bit nucleotide encoding
noodles = { version = "0.37", features = ["sam"] } # SAM output format

# Concurrency and performance
rayon = "1.8"           # Parallel processing
crossbeam = "0.8"       # Concurrent data structures
dashmap = "5.5"         # Thread-safe hash maps

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"            # TOML configuration files
bincode = "1.3"         # Efficient binary serialization

# Filesystem and IO
flate2 = "1.0"          # Gzip compression
memmap2 = "0.9"         # Memory mapping for files

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }  # Date/time for SAM headers

# For FFI interop during transition (if needed)
cxx = "1.0"

[dev-dependencies]
criterion = "0.5"       # For benchmarking
tempfile = "3.8"        # For creating temporary test files
test-case = "3.3"       # For parameterized tests
assert_cmd = "2.0"      # CLI command testing
assert_fs = "1.0"       # Filesystem assertions
predicates = "3.0"      # Better assertions
serial_test = "3.0"     # For tests that can't run in parallel

[build-dependencies]
miette = { version = "5", features = ["fancy"] } # For nice error messages

[profile.release]
lto = true              # Link-time optimization
codegen-units = 1       # Optimize for better performance
opt-level = 3           # Maximum optimization
panic = "abort"         # Smallest binary size
debug = true            # Keep debug symbols for profiling
